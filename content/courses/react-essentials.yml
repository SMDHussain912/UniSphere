slug: react-essentials
title: React Essentials
description: Build real user interfaces with components, props, state and hooks. The shortest honest path from empty page to working React app.
category: Web Development
level: Intermediate
tags: [react, frontend, javascript]
estimatedHours: 8
modules:
  - title: Components and JSX
    lessons:
      - title: Your First Component
        durationMinutes: 14
        content: |
          A React component is a function that returns markup. Component names must start with a capital letter.

          function Welcome({ name }) {
            return <h1>Hello {name}</h1>
          }

          JSX looks like HTML but compiles to JavaScript. Curly braces embed any expression.
        starterCode: |
          function Welcome({ name }) {
            return <h1>Hello {name}</h1>
          }
      - title: Props Flow Down
        durationMinutes: 12
        content: |
          Data in React flows one way, from parent to child through props. A prop is read-only, so children never mutate what they receive. When two components need the same data, lift it to their closest common parent.
    quiz:
      title: Components and JSX Quiz
      questions:
        - question: What must a React component name start with?
          options: [A lowercase letter, An underscore, A capital letter, A dollar sign]
          correctAnswer: 2
          marks: 1
        - question: How does data reach a child component?
          options: [Global variables, Through props, Through the DOM, Through localStorage]
          correctAnswer: 1
          marks: 1
  - title: State and Hooks
    lessons:
      - title: useState in Practice
        durationMinutes: 15
        content: |
          useState gives a component memory.

          const [count, setCount] = useState(0)

          Calling setCount schedules a re-render with the new value. Never mutate state directly, always go through the setter.
        starterCode: |
          const [count, setCount] = useState(0)
      - title: useEffect and Data Fetching
        durationMinutes: 16
        content: |
          useEffect runs code after render. Give it a dependency array to control when it runs. An empty array means run once after the first render, which is where you fetch data.

          useEffect(() => {
            fetch("/api/v1/courses").then(r => r.json()).then(setCourses)
          }, [])

          Return a cleanup function to cancel timers or subscriptions.
    quiz:
      title: State and Hooks Quiz
      questions:
        - question: What does the dependency array of useEffect control?
          options: ["The component name", "When the effect re-runs", "The render order", "The state type"]
          correctAnswer: 1
          marks: 1
        - question: What is the correct way to update state?
          options: ["count = 5", "setCount(5)", "count.push(5)", "state.set(5)"]
          correctAnswer: 1
          marks: 1
        - question: What does an empty dependency array mean?
          options: ["Run after every render", "Never run", "Run once after the first render", "Run only on unmount"]
          correctAnswer: 2
          marks: 1
